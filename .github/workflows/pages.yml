name: Deploy status page

on:
  push:
    branches: [main]
    paths: [site/**, assets/**, sites.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The page reads live data from the `data` branch, so it only needs
      # redeploying when the page itself changes.
      - name: Build
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r assets _site/assets
          echo '{"repo":"${{ github.repository }}","branch":"data"}' > _site/config.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
