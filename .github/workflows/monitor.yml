name: Monitor

# GitHub's cron is best-effort: on many repos "*/5" fires late or not at all.
# So each run stays alive for ~55 minutes, checks every 5 minutes, and then
# dispatches the next run itself. The cron is only a watchdog that restarts
# the chain if it ever breaks (an extra trigger just waits in the queue).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/monitor.yml, scripts/monitor.mjs]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

env:
  INTERVAL_SECONDS: 300
  RUN_SECONDS: 3300

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Status data lives on the `data` branch as a single, force-pushed commit,
      # so frequent checks never bloat the history of main.
      - name: Fetch current data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir .data && cd .data
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin data; then git checkout -q FETCH_HEAD -- .; fi

      - name: Check sites every 5 minutes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          end=$((SECONDS + RUN_SECONDS))
          while :; do
            started=$SECONDS
            # Pick up edits to sites.json without waiting for the next run.
            git fetch -q --depth=1 origin main && git checkout -q FETCH_HEAD -- sites.json || true

            node scripts/monitor.mjs sites.json .data || echo "::warning::Check failed"

            ( cd .data
              git update-ref -d HEAD 2>/dev/null || true
              git add -A
              git commit -q -m "Update status data"
              git push -q -f origin HEAD:refs/heads/data ) || echo "::warning::Publishing data failed"

            next=$((started + INTERVAL_SECONDS))
            [ "$next" -ge "$end" ] && break
            sleep $((next - SECONDS > 0 ? next - SECONDS : 0))
          done

      - name: Start next run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run monitor.yml --repo "${{ github.repository }}" --ref main
